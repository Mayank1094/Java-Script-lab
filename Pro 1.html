<!DOCTYPE html>
<html>
<body>
<script>
let num = Number(prompt("Enter number"));
let sum = 0;

for(let i = 1; i < num; i++)
{
    if(num % i == 0)
    {
        sum = sum + i;
    }
}

if(sum == num)
{
    alert("Perfect number");
}
else if(sum > num)
{
    alert("Abundant number");
}
else
{
    alert("Deficient number");
}
</script>
</body>
</html>
